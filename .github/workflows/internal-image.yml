name: Internal Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish CHEK image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CHEK Beijing registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ secrets.REGISTRY_ENDPOINT }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Check immutable publication state
        id: preflight
        env:
          GHCR_IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          BEIJING_IMAGE_REF: ${{ secrets.REGISTRY_ENDPOINT }}/prod/codex-lb:sha-${{ github.sha }}
        run: |
          image_state() {
            image_ref="$1"
            error_log="$2"
            if docker buildx imagetools inspect "${image_ref}" >/dev/null 2>"${error_log}"; then
              echo exists
              return
            fi
            if grep -Eiq 'manifest unknown|name unknown|not found' "${error_log}"; then
              echo absent
              return
            fi
            cat "${error_log}" >&2
            echo "::error::Unable to determine immutable image state: ${image_ref}"
            exit 1
          }

          ghcr_state=$(image_state "${GHCR_IMAGE_REF}" ghcr-inspect-error.log)
          beijing_state=$(image_state "${BEIJING_IMAGE_REF}" beijing-inspect-error.log)
          if [[ "${beijing_state}" == exists ]]; then
            echo "::error::Immutable Beijing image tag already exists: ${BEIJING_IMAGE_REF}"
            exit 1
          fi
          if [[ "${ghcr_state}" == exists ]]; then
            echo "Recovering the missing Beijing mirror from the existing immutable GHCR image"
            echo "build_ghcr=false" >> "${GITHUB_OUTPUT}"
          else
            echo "build_ghcr=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        if: steps.preflight.outputs.build_ghcr == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=codex-lb-internal
          cache-to: type=gha,mode=max,scope=codex-lb-internal

      - name: Mirror immutable image to CHEK Beijing registry
        env:
          GHCR_IMAGE_REF: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          BEIJING_IMAGE_REF: ${{ secrets.REGISTRY_ENDPOINT }}/prod/codex-lb:sha-${{ github.sha }}
        run: docker buildx imagetools create --tag "${BEIJING_IMAGE_REF}" "${GHCR_IMAGE_REF}"
